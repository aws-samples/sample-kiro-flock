              - 'iam:DeletePolicyVersion'
              - 'iam:SetDefaultPolicyVersion'
            Resource:
              'Fn::Sub': 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/kiro-flock-${Qualifier}-agent-boundary'
          - Sid: DenyFlockFunctions
            Effect: Deny
            NotAction:
              - 'lambda:Get*'
