              - 'Fn::Sub': 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/AgaStack-*'
          - Sid: DenyIdentityAndAccount
            Effect: Deny
            Action:
              - 'iam:*User*'
              - 'iam:*AccessKey*'
              - 'iam:*Group*'
