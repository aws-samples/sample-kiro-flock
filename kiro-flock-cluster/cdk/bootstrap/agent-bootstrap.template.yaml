            Resource: '*'
          - Sid: ApplicationRoles
            Effect: Allow
            Action:
              - 'iam:CreateRole'
              - 'iam:DeleteRole'
              - 'iam:GetRole'
              - 'iam:UpdateRole'
              - 'iam:UpdateRoleDescription'
              - 'iam:UpdateAssumeRolePolicy'
              - 'iam:TagRole'
