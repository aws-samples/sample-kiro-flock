              - 'ssm:StartSession'
            Resource:
              'Fn::Sub': 'arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:instance/*'
            Condition:
              StringEquals:
                'aws:ResourceTag/Project': kiro-flock
          - Sid: DenyUntaggedStackChanges
            Effect: Deny
            Action:
              - 'cloudformation:UpdateStack'
              - 'cloudformation:DeleteStack'
            Resource: '*'
            Condition:
              'Null':
                'aws:ResourceTag/KiroFlockManaged': 'true'
          - Sid: DenyUntaggingFlockStacks
            Effect: Deny
            Action:
              - 'cloudformation:UntagResource'
              - 'tag:UntagResources'
            Resource: '*'
            Condition:
              'ForAnyValue:StringEquals':
                'aws:TagKeys': KiroFlockManaged
  AgentPermissionsBoundary:
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
      ManagedPolicyName:
        'Fn::Sub': 'kiro-flock-${Qualifier}-agent-boundary'
