              - 'iam:UpdateAssumeRolePolicy'
            Resource: '*'
            Condition:
              StringNotEquals:
                'iam:PermissionsBoundary':
                  'Fn::Sub': 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/kiro-flock-${Qualifier}-agent-boundary'
          - Sid: DenyBoundaryRemoval
            Effect: Deny
            Action:
              - 'iam:DeleteRolePermissionsBoundary'
            Resource:
              'Fn::Sub': 'arn:${AWS::Partition}:iam::*:role/*'
            Condition:
              StringEquals:
                'iam:PermissionsBoundary':
                  'Fn::Sub': 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/kiro-flock-${Qualifier}-agent-boundary'
          - Sid: DenyBoundaryEdits
            Effect: Deny
            Action:
              - 'iam:CreatePolicyVersion'
