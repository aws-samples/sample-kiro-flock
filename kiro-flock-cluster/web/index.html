<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>kiro-flock</title>
<script>
  // Unified shell bootstrap. API Gateway serves this page at the stage
  // root ("/prod" or "/prod/"). Set <base href> to the stage root so
  // relative API calls ("cluster/...", "forge/...") always resolve
  // correctly, then inject all assets with explicit absolute URLs.
  //
  // Load order matters:
  //   1. CDN libs (marked, hljs, mermaid, chart.js, packery) — plain
  //      scripts, cached, shared by several sections.
  //   2. Shared classic-script panels (envPanel, analyzerPanel) — they
  //      attach to window.*.
  //   3. shell.js as an ES module — it owns auth, the topbar, the
  //      accordion, and lazy-imports section modules from sections/.
  (function() {
    var base = location.origin + location.pathname.replace(/\/?$/, "/");
    window.SHELL_BASE = base;

    function addCss(href) {
      var link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = href;
      document.head.appendChild(link);
    }
    function addScript(src, opts) {
      var s = document.createElement("script");
      s.src = src;
      // Dynamically-inserted scripts default to async execution; force
      // insertion order so the shared panels exist before shell.js boots.
      s.async = false;
      if (opts && opts.module) s.type = "module";
      document.currentScript.parentNode.appendChild(s);
    }

    var baseEl = document.createElement("base");
    baseEl.href = base;
    document.head.appendChild(baseEl);

    addCss(base + "shell.css");
    addCss(base + "envPanel.css");
    addCss(base + "analyzerPanel.css");
    addCss("https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/styles/github-dark.min.css");

    addScript("https://cdn.jsdelivr.net/npm/marked@15/marked.min.js");
    addScript("https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js");
    addScript("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js");
    addScript("https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js");
    addScript("https://cdn.jsdelivr.net/npm/packery@2.1.2/dist/packery.pkgd.min.js");

    addScript(base + "envPanel.js");
    addScript(base + "analyzerPanel.js");
    addScript(base + "shell.js", { module: true });
  })();
</script>
<script src="version.js"></script>
</head>
<body>

  <!-- Shared top bar. Fixed left (logo + version), a section-contextual
       slot that the active accordion section populates, and fixed right
       (poll indicator + sign out). -->
  <header class="sh-topbar">
    <div class="sh-topbar-left">
      <div class="sh-logo">kiro<span>-flock</span><span class="version-label"></span></div>
      <div id="sh-topbar-context" class="sh-topbar-context"></div>
    </div>
    <div class="sh-topbar-right">
      <span id="sh-poll-indicator" class="sh-poll-indicator" aria-live="polite">
        <span class="sh-poll-text">loading&#8230;</span>
      </span>
      <button class="sh-topbtn sh-topbtn-icon" id="btn-dashboard" title="Dashboard" aria-label="Open dashboard">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true">
          <rect x="1.5" y="8" width="3" height="6.5" rx="0.5"/>
          <rect x="6.5" y="4" width="3" height="10.5" rx="0.5"/>
          <rect x="11.5" y="1.5" width="3" height="13" rx="0.5"/>
        </svg>
      </button>
      <button class="sh-topbtn" id="btn-logout" style="display:none">Sign out</button>
    </div>
  </header>

  <div class="sh-main">
    <div class="sh-center">
      <!-- Horizontal accordion. shell.js builds one rail+pane pair per
           section; exactly one pane is open at a time. -->
      <div id="sh-accordion" class="sh-accordion"></div>

      <!-- Analyzer/optimizer bottom drawer, shared across all sections.
           Foldable down to just its bar. -->
      <div id="sh-drawer" class="sh-drawer">
        <div class="sh-drawer-bar" id="sh-drawer-bar" role="button" tabindex="0" aria-label="Toggle analyzer panel">
          <span class="sh-drawer-title">Analyze / Optimize</span>
          <span class="sh-drawer-chevron" id="sh-drawer-chevron">&#9662;</span>
        </div>
        <div id="analyzer-container" class="sh-drawer-body wb-analyzer-wrap"></div>
      </div>
    </div>

    <div class="sh-resize-handle" id="sh-resize-handle"></div>

    <!-- Environment column, shared across all sections. Foldable to a
         thin vertical strip on the right. -->
    <aside class="sh-right" id="sh-right">
      <div class="sh-right-bar">
        <span class="sh-right-title">Environment</span>
        <button class="sh-fold-btn" id="sh-env-toggle" title="Collapse environment panel">&#10151;</button>
      </div>
      <div id="env-container" class="sh-env-body"></div>
    </aside>
  </div>

  <div id="toast" class="toast sh-toast"></div>

</body>
</html>
